[project]
name = "shopdesk"
version = "0.1.0"
description = "Workshop: Architecting Multi-Agent Systems with Google ADK"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["shopdesk*"]

[tool.setuptools.package-data]
shopdesk = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
